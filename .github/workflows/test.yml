name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Perl ${{ matrix.perl }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        perl:
          - '5.10'
          - '5.12'
          - '5.14'
          - '5.16'
          - '5.18'
          - '5.20'
          - '5.26'
          - '5.32'
          - '5.38'
          - '5.40'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}

      - name: Show Perl version
        run: perl -V

      - name: Install dependencies
        run: cpanm --notest HTTP::Tiny JSON::PP MIME::Base64 Scalar::Util Time::HiRes Test::More

      - name: Configure
        run: perl Makefile.PL

      - name: Run tests
        run: make test

      - name: Verify tests ignore invalid ambient proxies
        if: matrix.perl == '5.40'
        run: |
          env http_proxy=invalid-proxy https_proxy=invalid-proxy \
            HTTP_PROXY=invalid-proxy HTTPS_PROXY=invalid-proxy \
            all_proxy=invalid-proxy ALL_PROXY=invalid-proxy make test

      - name: Test packaged distribution
        if: matrix.perl == '5.40'
        run: make disttest
